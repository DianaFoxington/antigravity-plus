<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Antigravity Plus Banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c10" />
      <stop offset="55%" stop-color="#121110" />
      <stop offset="100%" stop-color="#19130d" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)" />
  <rect width="1200" height="320" rx="20" fill="url(#grid)" />
  <rect width="1200" height="320" rx="20" fill="url(#glow1)" />
  <rect width="1200" height="320" rx="20" fill="url(#glow2)" />
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Left geometric mark -->
  <g transform="translate(88, 72)">
    <rect x="0" y="0" width="96" height="96" rx="24" fill="#181614" stroke="#f97316" stroke-opacity="0.45" stroke-width="1.5" />
    <path d="M48 20 L73 72 L61 72 L48 43 L35 72 L23 72 Z" fill="url(#accent)" />
    <circle cx="48" cy="63" r="4.5" fill="#fed7aa" />
    <circle cx="76" cy="20" r="9" fill="#f97316" />
    <path d="M76 15.5 V24.5 M71.5 20 H80.5" stroke="#0b0c10" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Title & Tagline -->
  <text x="212" y="114" fill="#f8fafc" font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">
    Antigravity <tspan fill="url(#accent)">Plus</tspan>
  </text>
  <text x="214" y="152" fill="#cbd5e1" font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="400">
    Multi-Provider AI Gateway, 300ms OAuth Switcher, 2M Context Patcher &amp; 12-Language RTL Engine
  </text>

  <!-- Feature Pills -->
  <g transform="translate(212, 186)" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">
    <rect x="0" y="0" width="136" height="34" rx="17" fill="#1e1a17" stroke="#f97316" stroke-opacity="0.4" />
    <text x="68" y="21.5" text-anchor="middle" fill="#fdba74">26+ Providers</text>

    <rect x="148" y="0" width="144" height="34" rx="17" fill="#181a1f" stroke="#ffffff" stroke-opacity="0.14" />
    <text x="220" y="21.5" text-anchor="middle" fill="#e2e8f0">300ms OAuth Vault</text>

    <rect x="304" y="0" width="146" height="34" rx="17" fill="#181a1f" stroke="#ffffff" stroke-opacity="0.14" />
    <text x="377" y="21.5" text-anchor="middle" fill="#e2e8f0">1M+ Context Cap</text>

    <rect x="462" y="0" width="166" height="34" rx="17" fill="#181a1f" stroke="#ffffff" stroke-opacity="0.14" />
    <text x="545" y="21.5" text-anchor="middle" fill="#e2e8f0">HTTP / SOCKS5 Proxy</text>

    <rect x="640" y="0" width="162" height="34" rx="17" fill="#181a1f" stroke="#ffffff" stroke-opacity="0.14" />
    <text x="721" y="21.5" text-anchor="middle" fill="#e2e8f0">12 Languages + RTL</text>

    <rect x="814" y="0" width="114" height="34" rx="17" fill="#151b17" stroke="#22c55e" stroke-opacity="0.35" />
    <text x="871" y="21.5" text-anchor="middle" fill="#86efac">Zero Deps</text>
  </g>

  <!-- Footer bar -->
  <line x1="88" y1="258" x2="1112" y2="258" stroke="#ffffff" stroke-opacity="0.07" />
  <text x="88" y="287" fill="#94a3b8" font-family="Consolas, ui-monospace, monospace" font-size="13.5">
    Windows · macOS · Linux  |  Update-Proof Auto Re-Patch Watcher  |  MIT License
  </text>
  <text x="1112" y="287" text-anchor="end" fill="#fb923c" font-family="Consolas, ui-monospace, monospace" font-size="13.5">
    github.com/DianaFoxington/antigravity-plus
  </text>
</svg>
