name: Feature Request
description: Suggest a new provider, language, or feature for Antigravity Plus
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What would you like to see added or improved?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Why is this useful?
