name: Bug Report
description: Report a bug in Antigravity Plus
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Antigravity Desktop Version
      placeholder: e.g. v2.29.1
    validations:
      required: true
  - type: textarea
    id: status_output
    attributes:
      label: Output of `node cli.js status`
      render: shell
  - type: textarea
    id: description
    attributes:
      label: Describe the bug and steps to reproduce
    validations:
      required: true
