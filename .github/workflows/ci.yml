name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JS syntax across all modules
        run: |
          node -c cli.js
          node -c src/asar.js
          node -c src/binaryPatcher.js
          node -c src/gatewayForwarder.js
          node -c src/jsPatcher.js
          node -c src/networkAndPlugins.js
          node -c src/patcher.js
          node -c src/paths.js
          node -c src/uiLocalization.js
          node -c src/watcher.js

      - name: Validate JSON & 12-language locale pack
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.name !== 'antigravity-plus') throw new Error('Invalid package name');
            const locales = JSON.parse(fs.readFileSync('src/locales.json', 'utf8'));
            const expected = ['fa','zh','ru','ar','tr','es','pt','ja','ko','de','fr'];
            for (const c of expected) {
              if (!locales[c] || Object.keys(locales[c].dict || {}).length < 500) {
                throw new Error('Incomplete locale pack: ' + c);
              }
            }
            console.log('Validated', expected.length + 1, 'languages cleanly');
          "

      - name: CLI smoke test
        run: node cli.js help
